\"}]}]}]]}],[\"$\",\"div\",null,{\"className\":\"faq-a\",\"children\":\"It is an EVM chain built on Arbitrum Nitro, so standard wallets and tooling work and settlement fees stay small relative to a job. The chain is a setting in the app, not a hard dependency of the protocol.\"}]]}],[\"$\",\"details\",\"Is there a token?\",{\"children\":[[\"$\",\"summary\",null,{\"children\":[\"Is there a token?\",[\"$\",\"span\",null,{\"className\":\"plus\",\"children\":[\"$\",\"svg\",null,{\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":1.7,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"aria-hidden\":\"true\",\"children\":[\"$\",\"path\",null,{\"d\":\"M12 5v14M5 12h14\"}]}]}]]}],[\"$\",\"div\",null,{\"className\":\"faq-a\",\"children\":\"The TasQ token is not part of the protocol. Prices, escrow and stake use non-transferable credits pegged to a US dollar reference, and contributor payouts settle in ETH. None of the security arguments depend on a token price. Section 9.6 of the yellow paper explains what the token funds.\"}]]}],[\"$\",\"details\",\"Is it decentralised?\",{\"children\":[[\"$\",\"summary\",null,{\"children\":[\"Is it decentralised?\",[\"$\",\"span\",null,{\"className\":\"plus\",\"children\":[\"$\",\"svg\",null,{\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":1.7,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"aria-hidden\":\"true\",\"children\":[\"$\",\"path\",null,{\"d\":\"M12 5v14M5 12h14\"}]}]}]]}],[\"$\",\"div\",null,{\"className\":\"faq-a\",\"children\":\"Not yet. In v1.0 the TasQ Project runs the coordinators, so you are trusting us to schedule fairly. What you do not have to trust us with is your data or the correctness of results, because both are checked by mechanisms you can verify. The paper sets out what changes after v1.0.\"}]]}],[\"$\",\"details\",\"What does post-quantum mean here?\",{\"children\"
